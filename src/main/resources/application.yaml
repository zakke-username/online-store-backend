spring:
  application:
    name: online-store-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3306/${DB_NAME:online_store}
    username: ${DB_USERNAME:online_store_app}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        serialization-mode: via-dto
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8081
